name: EZStay PG Dependency Lock

on:
  push:
    branches: ["feature/ezstay-hyperdrive-adapter"]
    paths:
      - ".github/workflows/ezstay-pg-lock.yml"

permissions:
  contents: write

jobs:
  pin-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ezstay-hyperdrive-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --save-exact pg@8.23.0
      - name: Commit pinned dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: pin Hyperdrive Postgres driver"
          git push origin HEAD:feature/ezstay-hyperdrive-adapter
