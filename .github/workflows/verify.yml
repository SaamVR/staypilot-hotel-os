name: Verify StayPilot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify backend contracts
        run: npm run verify:backend
      - name: Verify EZStay
        run: npm run verify:ezstay
      - name: Build
        run: npm run build
      - name: Upload production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: staypilot-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
      - name: Stage Cloudflare deployment branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B cloudflare-deploy
          git add -f dist
          git commit -m "stage Cloudflare bundle for $GITHUB_SHA"
          git push --force origin cloudflare-deploy
