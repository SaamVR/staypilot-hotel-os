name: Sync EZStay Supabase lockfile

on:
  push:
    branches: ["feature/ezstay-auth-client"]
    paths: ["package.json"]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ezstay-auth-client
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Resolve exact lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync Supabase JS lockfile"
          git push origin HEAD:feature/ezstay-auth-client
