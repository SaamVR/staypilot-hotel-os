name: EZStay Visual QA

on:
  push:
    branches: ["feature/ezstay-visual-qa"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install pinned browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Verify and build
        run: |
          npm run verify:backend
          npm run verify:ezstay
          (cd portfolio-backend && npm run verify)
          npm run build

      - name: Start exact built bundle
        run: |
          python3 -m http.server 4177 --directory dist >/tmp/ezstay-qa-http.log 2>&1 &
          echo $! > /tmp/ezstay-qa-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4177/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ezstay-qa-http.log
          exit 1

      - name: Run browser story
        run: node scripts/run-ezstay-visual-qa.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ezstay-visual-qa
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7
