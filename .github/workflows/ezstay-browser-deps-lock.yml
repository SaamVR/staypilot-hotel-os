name: EZStay Browser Dependency Lock

on:
  push:
    branches: ["feature/ezstay-browser-backend"]
    paths:
      - ".github/workflows/ezstay-browser-deps-lock.yml"

permissions:
  contents: write

jobs:
  pin-dependency:
    if: "!contains(github.event.head_commit.message, 'chore: pin Supabase browser client')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ezstay-browser-backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --save-exact @supabase/supabase-js@2.117.1
      - name: Commit pinned dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: pin Supabase browser client"
          git push origin HEAD:feature/ezstay-browser-backend
